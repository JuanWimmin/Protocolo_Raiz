[package]
name = "treasury"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "RAÍZ · Contrato Treasury — ejecución auditable de propuestas"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Para tests integrados: registramos los 3 contratos hermanos en el env
# de test y los wireamos como en producción.
pool = { path = "../pool" }
governance = { path = "../governance" }
rewards = { path = "../rewards" }
# F1: yield_adapter real (BlendAdapter), como hace pool. Los tests hablan con
# un MockBlendPool local (mismo patrón duplicado que pool/src/test.rs).
yield_adapter = { path = "../yield_adapter" }
