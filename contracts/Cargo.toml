[workspace]
resolver = "2"
members = [
    "pool",
    "governance",
    "treasury",
    "rewards",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RAÍZ"]
license = "MIT"

[workspace.dependencies]
# Si tu toolchain tiene una versión más nueva publicada, sube aquí.
# La 22.0.8 es la línea estable que coincide con la API que ya usa el borrador
# (env.register(Contract, ()), register_stellar_asset_contract_v2, etc.)
soroban-sdk = "22.0.8"

# Profile optimizado para tamaño WASM (Stellar limita el tamaño del contrato).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
