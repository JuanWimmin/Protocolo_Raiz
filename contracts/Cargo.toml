[workspace]
resolver = "2"
members = [
    "pool",
    "governance",
    "treasury",
    "rewards",
    "yield_adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RAÍZ"]
license = "MIT"

[workspace.dependencies]
# 26.1.1: última serie estable soportada al migrar (2026-07-31). Sin breaking
# changes para la API que usa RAÍZ (env.register(Contract, ()),
# register_stellar_asset_contract_v2, etc.) más allá de env.events().all()
# (ver pool/src/test.rs) y los límites de recursos por defecto en tests.
soroban-sdk = "26.1.1"

# Profile optimizado para tamaño WASM (Stellar limita el tamaño del contrato).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
