[package]
name = "pool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "RAÍZ · Contrato Pool — pagos y fondo del barrio"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Para tests: registramos el contrato Rewards real en el env de test
# así el cross-contract call a accrue_points funciona.
rewards = { path = "../rewards" }
