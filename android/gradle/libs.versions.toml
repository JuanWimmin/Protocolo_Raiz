[versions]
agp = "8.7.3"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.2"
hilt = "2.56"
hiltNavigation = "1.2.0"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigation = "2.8.5"
coreKtx = "1.15.0"
stellarSdk = "1.6.0"
coroutines = "1.9.0"
serialization = "1.7.3"
bignum = "0.3.10"
conscrypt = "2.5.2"
ktor = "3.3.2"
zxing = "3.5.3"
zxingEmbedded = "4.3.0"
securityCrypto = "1.1.0-alpha06"
biometric = "1.1.0"
junit = "4.13.2"
# Credential Manager para passkey WebAuthn. Ya viene transitivamente vía stellar-sdk,
# pero lo declaramos explícito para que el build no dependa de ese detalle de transitividad.
credentialsManager = "1.3.0"
mapbox = "11.9.0"
mapboxCompose = "11.9.0"

[libraries]
# Core / Compose
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose BOM agrupa: ui, material3, foundation, tooling, etc.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }

# Stellar SDK (Soneso KMP) — Horizon + Soroban RPC + smart accounts
stellar-sdk = { module = "com.soneso.stellar:stellar-sdk", version.ref = "stellarSdk" }

# Coroutines (lo usamos para los suspend de SorobanClient)
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Para parsear deployments.json desde assets
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# BigInteger usado por Scv.fromInt128 (Stellar SDK lo trae como implementation,
# tenemos que declararlo explícito para poder importarlo en nuestro código).
ionspin-bignum = { module = "com.ionspin.kotlin:bignum", version.ref = "bignum" }

# Conscrypt — provider TLS de Google que usa el trust store nativo de Android.
# Necesario porque el Stellar SDK usa Ktor con engine CIO + BouncyCastle, que
# no resuelve la cadena de certs del sistema y dispara
# "Trust anchor for certification path not found" en HTTPS hacia testnet.
# Se instala como provider preferido en RaizApplication.onCreate().
conscrypt-android = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }

# Ktor HttpClient — el SDK lo trae como implementation; lo declaramos
# explícito para poder referenciar el tipo HttpClient en HorizonStream
# (constructor de HorizonServer lo requiere).
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }

# Ktor — cliente HTTP hacia el relayer admin (D1 SOW, ver data/relayer/RelayerClient.kt).
# CIO ya llega transitivo vía el Stellar SDK; content-negotiation + serialization-json
# se declaran explícitos porque el SDK no los necesita para sus propios usos de Ktor.
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Solo test: engine falso para RelayerClientTest (MockEngine, sin red real).
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Solo test JVM puro (src/test): JUnit 4 + kotlinx-coroutines-test (runTest).
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# ZXing — generación y escaneo de QR.
# `core` puro JVM para generar bitmaps; `android-embedded` provee un
# Activity de escaneo basado en cámara.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }

# EncryptedSharedPreferences — persistencia de la seed phrase cifrada con
# una clave que vive en el Android Keystore (TEE en hardware si está
# disponible). Necesario para guardar la wallet del usuario al crear/importar.
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

# Biometric — BiometricPrompt para bloquear la app con huella/rostro + credencial
# del dispositivo (PIN/patrón). No guardamos PIN propio: lo gestiona el SO.
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

# Credential Manager + FIDO2 Play Services para passkey WebAuthn (smart account).
# credentials-play-services-auth delega en Google Play Services en dispositivos
# Android 8 y 9 (API 26-28) que no implementan FIDO2 de forma nativa; en
# Android 9+ lo gestiona el sistema directamente.
# Ambas AARs ya están en el Gradle cache como transitivas de stellar-sdk-android,
# pero las declaramos explícitas para no depender de ese detalle de empaquetado.
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentialsManager" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentialsManager" }

# Mapbox Maps SDK + extensión Compose.
# Descarga del Maven privado de Mapbox; requiere MAPBOX_DOWNLOADS_TOKEN (sk.*)
# en ~/.gradle/gradle.properties global (NO en el repo). El runtime usa el
# token público pk.* desde local.properties → BuildConfig.MAPBOX_TOKEN.
mapbox-maps-android = { module = "com.mapbox.maps:android", version.ref = "mapbox" }
mapbox-maps-compose = { module = "com.mapbox.extension:maps-compose", version.ref = "mapboxCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
