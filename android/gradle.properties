# Gradle config
# Fuerza el JDK del IDE (21) en lugar del JDK del PATH del sistema (25).
# Kotlin 2.1.21 no puede parsear la cadena de versión "25.0.1" de JDK 25
# y lanza IllegalArgumentException antes de compilar nada.
# El JDK se fija POR MÁQUINA en ~/.gradle/gradle.properties (tiene precedencia sobre este archivo), p. ej.:
#   org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Mapbox download token (sk.* con scope Downloads:Read). NO commitear el valor real.
# Cada miembro del equipo lo pone en ~/.gradle/gradle.properties (no aquí).
# Si no lo configuras, el repo Maven de Mapbox quedará sin auth y los artefactos
# no se descargarán — la pantalla del mapa fallará al compilar.
# MAPBOX_DOWNLOADS_TOKEN=sk.eyJ1Ijo...
